[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/sitemap4.xml"
  to = "/sitemap4.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public,max-age=86400"
